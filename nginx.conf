server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Standard Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy ke backend container Hono
    location /api/ {
        proxy_pass http://imm-cbt-api-nh8mcz:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block access to hidden files and directories (e.g. .git, .env)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block access to sensitive and plain text files (credentials, env, logs, scripts, markdown)
    location ~* \.(txt|env|log|sh|md|git.*|sql|bak|conf)$ {
        return 404;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Media & PDF static cache with HTTP 206 Byte-Range streaming
    location ~* \.(jpg|jpeg|png|webp|gif|ico|css|js|mp3|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
